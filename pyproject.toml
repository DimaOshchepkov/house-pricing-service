[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "house-pricing-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "catboost>=1.2.10",
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.52",
    "testcontainers[postgresql]>=4.15.0",
    "uuid7>=0.1.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.46.5",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = [
    "catboost.*",
    "uuid_extensions.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: smoke тесты. Требуют запущенной БД и файла модели. Меняют состояния бд",
    "integration: интеграционные тесты в test containers"
]
addopts = "-m 'not smoke'"
