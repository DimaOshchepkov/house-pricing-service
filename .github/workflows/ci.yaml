name: ci
on:
  push: {branches: [master]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: house}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      
    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:test@localhost:5432/house"
      ARTIFACT_FILE_NAME: "model_v20260914_195522.cbm"


    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
  
  build:
    needs: tests
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses:  docker/setup-buildx-action@v4
      - uses:  docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha 
          cache-to: type=gha,mode=max
  
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: read}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - uses: helm/kind-action@v1
        with: {cluster_name: ci}

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name ci

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
            kubectl apply -f k8s/configmap.yaml
            kubectl create secret generic housing-env \
                --from-literal=POSTGRES_USER="postgres" \
                --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
                --from-literal=POSTGRES_DB="house" \
                --from-literal=DATABASE_URL="postgresql+asyncpg://postgres:$DB_PASSWORD@postgres-service:5432/house" \
                --dry-run=client -o yaml | kubectl apply -f -
      
      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s
      
      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/housing-service api="$IMAGE"
          kubectl rollout status deploy/housing-service --timeout=120s

      - name: smoke тесты
        run: |
          kubectl port-forward svc/housing-service 8080:80 &
          sleep 5

          curl --fail -s http://localhost:8080/health || exit 1
          echo "Health check passed!"

          curl --fail -s -X POST http://localhost:8080/v1/predict \
            -H "Content-Type: application/json" \
            -d @good.json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print('Prediction OK:', r)"

          sleep 3

    
          COUNT=$(kubectl exec deployment/postgres -- psql -U postgres -d house -t -c "SELECT count(*) FROM predictions;")
          CLEAN_COUNT=$(echo "$COUNT" | tr -d '[:space:]')
          
          if [ "$CLEAN_COUNT" -ge 1 ]; then
            echo "Success! Found $CLEAN_COUNT records in DB."
          else
            echo "Error: No records found in DB (count=$CLEAN_COUNT)."
            exit 1
          fi
      
      - name: диагностика
        if: failure()

        run: |
          kubectl get pods -o wide
          kubectl describe deploy/housing-service | tail -20
          kubectl logs deploy/housing-service --tail=30 || true