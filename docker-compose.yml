services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - .env 
    volumes:
      - ./src:/app/src
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/house
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: house
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:


